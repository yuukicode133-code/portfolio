{{> header}}

<main>
    <section class="l-inner p-fv-section">
        <div class="p-fv-section__inner">
            <h2 class="p-fv-section__title">
                <span class="p-fv-section__title-head">
                    web coder
                </span>
                <span class="p-fv-section__title-body">
                    つくること。考えること。
                </span>
            </h2>
            <div class="p-fv__blob">
                <div class="p-fv__blob-accent"></div>
                <div class="p-fv__blob-mint"></div>
            </div>
            <div class="scroll-down">
                <span class="scroll-down__text">scroll</span>
            </div>
        </div>
    </section>
    <section class="l-inner p-works-section l-section">
        <div class="p-works-section__wrapper">
            <h2 class="c-section-title  p-works-section__title">
                <span class="c-section-title__en">works</span>
                <span class="c-section-title__ja">制作実績</span>
            </h2>
            <div class="l-works__contents">
                <div class="l-works__left p-works__button-wrapper">
                    <a href="" class="p-works__button">実績を見る</a>
                </div>
                <div class="l-works__right p-works__card-wrapper">
                    <!-- wordpress -->
                    <div class="p-works__card">
                        <div class="p-works__card-image">
                            <picture>
                                <source srcset="/images/test-wp.webp" type="image/webp">
                                <img src="/images/test-wp.png" alt="ポートフォリオサイトの画像" width="375" height="250">
                            </picture>

                        </div>
                        <div class="p-works__card-content">
                            <h3 class="p-works__card-title">ポートフォリオサイト</h3>
                            <ul class="p-works__card-tags">
                                <li class="p-works__card-tag">wordpress</li>
                            </ul>
                        </div>
                    </div>


                    <!-- green -->
                    <div class="p-works__card">
                        <div class="p-works__card-image">
                            <picture>
                                <source srcset="/images/test-wp.webp" type="image/webp">
                                <img src="/images/test-wp.png" alt="ポートフォリオサイトの画像" width="375" height="250">
                            </picture>

                        </div>
                        <div class="p-works__card-content">
                            <h3 class="p-works__card-title">ポートフォリオサイト</h3>
                            <ul class="p-works__card-tags">
                                <li class="p-works__card-tag">wordpress</li>
                            </ul>
                        </div>
                    </div>

                    <!-- oha -->
                    <div class="p-works__card">
                        <div class="p-works__card-image">
                            <picture>
                                <source srcset="/images/test-wp.webp" type="image/webp">
                                <img src="/images/test-wp.png" alt="ポートフォリオサイトの画像" width="375" height="250">
                            </picture>

                        </div>
                        <div class="p-works__card-content">
                            <h3 class="p-works__card-title">ポートフォリオサイト</h3>
                            <ul class="p-works__card-tags">
                                <li class="p-works__card-tag">wordpress</li>
                            </ul>
                        </div>
                    </div>

                </div>
            </div>
        </div>
    </section>
</main>

{{> footer}}
