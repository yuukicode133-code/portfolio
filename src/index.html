{{> header}}

<main>
  <!-- FV -->
  <section class="l-inner p-fv-section">
    <div class="p-fv-section__inner">
      <h2 class="p-fv-section__title">
        <span class="p-fv-section__title-head">web coder</span>
        <span class="p-fv-section__title-body">つくること。考えること。</span>
      </h2>
      <div class="scroll-down">
        <span class="scroll-down__text">scroll</span>
      </div>
    </div>
  </section>

  <!-- FV Blob -->
  <div class="l-blob l-inner">
    <div class="p-blob__wrapper">
      <div class="p-blob-green"></div>
      <div class="p-blob-accent"></div>
      <div class="p-blob-mint"></div>
    </div>
  </div>

  <!-- Works -->
  <section class="l-inner p-works-section l-section">
    <div class="p-works__contents">
      <div class="p-works__left">
        <h2 class="c-section-title p-works-section__title">
          <span class="c-section-title__en">works</span>
          <span class="c-section-title__ja">制作実績</span>
        </h2>
        <a href="" class="p-works__button c-button--white">全ての実績を見る</a>
      </div>
      <div class="p-works__right">
        <!-- wordpress -->
        <div class="p-works__card-wrapper">
          <div class="p-works__card">
            <div class="p-works__card-image">
              <picture>
                <source srcset="/images/test-wp.webp" type="image/webp" />
                <img src="/images/test-wp.png" alt="ポートフォリオサイトのサムネイル画像" width="1978" height="1930" />
              </picture>
            </div>
            <div class="p-works__card-content">
              <h3 class="p-works__card-title">ポートフォリオサイト</h3>
              <ul class="p-works__card-tags">
                <li class="p-works__card-tag">WordPress</li>
                <li class="p-works__card-tag">ポートフォリオサイト</li>
              </ul>
            </div>
          </div>
        </div>

        <!-- green -->
        <div class="p-works__card-wrapper">
          <div class="p-works__card">
            <div class="p-works__card-image">
              <picture>
                <source srcset="/images/green.webp" type="image/webp" />
                <img src="/images/green.png" alt="ポートフォリオサイトのサムネイル画像" width="375" height="250" />
              </picture>
            </div>
            <div class="p-works__card-content">
              <h3 class="p-works__card-title">[架空] green 海外デザイナーのポートフォリオ</h3>
              <ul class="p-works__card-tags">
                <li class="p-works__card-tag">ポートフォリオサイト</li>
              </ul>
            </div>
          </div>
        </div>

        <!-- oha -->
        <div class="p-works__card-wrapper">
          <div class="p-works__card">
            <div class="p-works__card-image">
              <picture>
                <source srcset="/images/oha.webp" type="image/webp" />
                <img src="/images/oha.png" alt="LPサイトのサムネイル画像" width="375" height="250" />
              </picture>
            </div>
            <div class="p-works__card-content">
              <h3 class="p-works__card-title">oha!</h3>
              <ul class="p-works__card-tags">
                <li class="p-works__card-tag">LP</li>
              </ul>
            </div>
          </div>
        </div>
      </div>
    </div>
  </section>

  <!-- Service -->
  <section class="l-inner p-servive-section l-section">
    <div class="p-service-section__wrapper">
      <h2 class="c-section-title p-service-section__title">
        <span class="c-section-title__en">service</span>
        <span class="c-section-title__ja">できること</span>
      </h2>
    </div>
  </section>

  <!-- About and Contact  parallax-->
  <div class="l-about-section__wrapper">
    <!-- About -->
    <section class="l-inner p-about-section l-section">
      <div class="p-about-section__wrapper">
        <h2 class="c-section-title p-about-section__title">
          <span class="c-section-title__en">about</span>
          <span class="c-section-title__ja">自己紹介</span>
        </h2>
      </div>
    </section>

    <!-- Contact -->
    <section class="l-inner p-contact-section l-section">
      <div class="p-contact-section__wrapper">
        <h2 class="c-section-title p-contact-section__title">
          <span class="c-section-title__en">contact</span>
          <span class="c-section-title__ja">お問い合わせ</span>
        </h2>
      </div>
    </section>
  </div>

  <!-- Footer -->
  <footer class="l-footer">
    <div class="l-inner p-footer">
      <p class="p-footer__copyright">&copy; 2026 Portfolio. All rights reserved.</p>
    </div>
  </footer>
</main>

{{> footer}}
